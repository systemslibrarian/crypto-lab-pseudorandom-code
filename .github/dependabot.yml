# Grouped so an ecosystem's routine bumps arrive as ONE pull request instead of
# one per dependency. Ungrouped, this fleet opened 1,461 PRs across 176 repos.
#
# Majors are deliberately left OUT of the npm group. When the 2026-08-18 backlog
# was landed by hand across this fleet, 109 bumps had to be held back and they
# were overwhelmingly majors. Grouping a breaking major together with the safe
# bumps makes the whole PR unmergeable, so majors come individually and a human
# decides. This lab has no runtime dependencies at all -- the cryptography is
# hand-rolled over typed arrays, which is the point -- so every npm bump here is
# a toolchain bump, and the ones that bite are exactly the majors: TypeScript 7
# stops tolerating an undeclared side-effect import, and Vitest 4 enforces
# timeouts Vitest 2 only raced a timer against.
#
# github-actions majors ARE grouped: checkout v4->v7, setup-node v4->v7 and the
# Pages v5/v6 jumps were verified green across all 176 repos on 2026-08-18.
#
# The minor/patch group and the actions group auto-merge once this lab's own gate
# passes on the PR -- see the dependabot-auto-merge job in the deploy workflow.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
