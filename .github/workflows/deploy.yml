name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:          # the gate must judge pull requests too — see §6.1
    branches: [main]
  workflow_dispatch:     # so a deploy can be re-run by hand — see §6.2

permissions:
  contents: read

concurrency:
  # A pull-request run must never cancel a live main deployment, which is what
  # a bare `pages` group plus cancel-in-progress does the moment the workflow
  # gains a pull_request trigger.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies exactly from the lockfile
        run: npm ci

      - name: Stamp the artifact with its exact source revision
        run: |
          mkdir -p public
          printf '{"source_sha":"%s","repository":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" > public/deployment.json

      # The WHOLE suite, not the a11y half. A 2026-08-14 sweep found 29 repos
      # whose deploy job ran `test:a11y` alone, so their algorithmic suites
      # never blocked a publish. Here that would mean shipping a lab whose
      # parity checks were wrong so long as the browser specs passed.
      - name: Unit and correctness tests (Vitest)
        env:
          # Vitest colours its summary even into a pipe, and the escape codes
          # land between "Tests" and the count.
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          set -eu
          npm test 2>&1 | tee /tmp/vitest.log
          # A test step that runs ZERO tests exits 0. Read the count rather
          # than the exit code.
          #
          # Strip ANSI before matching, and do not trust NO_COLOR alone: this
          # guard once failed a run in which all 151 tests passed, because the
          # log held "Tests \e[1m\e[32m151 passed" and `Tests +[0-9]+` cannot
          # match across the escape. A guard that fails closed on its own
          # formatting blocks the deploy while saying nothing about the lab.
          sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/vitest.log > /tmp/vitest.plain
          grep -Eq 'Tests +[0-9]+ passed' /tmp/vitest.plain || {
            echo "::error::the Vitest summary did not report any passing tests"
            exit 1
          }

      - name: Build (typecheck gates the build)
        run: npm run build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  # The image carries the exact browser binaries and Linux libraries expected
  # by the Playwright version the lockfile resolves. Pinned by digest so the
  # rendering and runtime environment cannot drift under an unchanged commit.
  #
  # The image TAG must match that version, and @playwright/test is pinned
  # exactly for that reason. A caret range here is how this gate broke once
  # already: `^1.64.0` resolved to 1.65.1 against the v1.64.0 image, every
  # browser launch failed with "Executable doesn't exist at
  # /ms-playwright/chromium_headless_shell-...", and the deploy was skipped --
  # a red gate that says nothing about the lab. The step below names that
  # mismatch instead of letting it surface as a missing file.
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    env:
      # The Actions runner mounts a HOME that Firefox cannot use in-container.
      HOME: /root
      # Keep in step with the image tag above; asserted before the gate runs.
      EXPECTED_PLAYWRIGHT_VERSION: 1.65.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies exactly from the lockfile
        run: npm ci

      # Accessibility gate (axe-core, WCAG A/AA), claims suite, and the
      # cross-engine flows. The flows matter here more than in most labs: this
      # one generates its key in a module Web Worker, which is the single most
      # engine-dependent thing in the repo, and a page whose worker never
      # starts renders placeholders that a scan reports as perfectly
      # accessible.
      - name: Fail if the installed Playwright does not match the image
        run: |
          set -eu
          installed=$(npx playwright --version | awk '{print $2}')
          echo "installed Playwright $installed; image carries browsers for $EXPECTED_PLAYWRIGHT_VERSION"
          [ "$installed" = "$EXPECTED_PLAYWRIGHT_VERSION" ] || {
            echo "::error::Playwright $installed does not match the container image ($EXPECTED_PLAYWRIGHT_VERSION); its browsers are not in this image. Bump the image digest and EXPECTED_PLAYWRIGHT_VERSION together, or pin @playwright/test back."
            exit 1
          }

      - name: Complete browser gate (accessibility, claims, cross-browser flows)
        run: npm run test:e2e:all

  deploy:
    needs: [build, browser-gate]
    # NOT `== 'push'`. That would also skip workflow_dispatch, which is the one
    # trigger §6.2 depends on: the dispatched run would build, pass the gate,
    # and skip the deploy, so the site would still never update.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Verify served Pages bytes match the deployed revision
        env:
          LIVE_URL: https://systemslibrarian.github.io/crypto-lab-pseudorandom-code/
        run: |
          set -eu
          for attempt in $(seq 1 18); do
            result=$(curl -fsSL --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' "${LIVE_URL}deployment.json?sha=${GITHUB_SHA}" 2>/dev/null || true)
            if node -e 'try { const p=JSON.parse(process.argv[1]);process.exit(p.source_sha===process.argv[2]&&p.repository===process.argv[3]?0:1) } catch { process.exit(1) }' "$result" "$GITHUB_SHA" "$GITHUB_REPOSITORY"; then
              html=$(curl -fsSL --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' "${LIVE_URL}?sha=${GITHUB_SHA}" 2>/dev/null || true)
              if printf '%s' "$html" | grep -Fq 'id="app"'; then
                echo "Verified live HTML and source revision $GITHUB_SHA at $LIVE_URL"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Live Pages failed source-SHA/HTML verification"
          exit 1

  # Dependabot only. The complete gate decides whether a bump is safe; this job
  # then merges and explicitly dispatches the main deployment.
  dependabot-auto-merge:
    needs: [build, browser-gate]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: bump
        name: Read the bump type from the pull request itself
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # No third-party action in the merge path, and no API call either: the
        # versions come from the pull request's own text, which the triggering
        # event already carries, judged by an in-repo script that answers
        # major / non-major / unknown. Only non-major merges; unknown waits for
        # a person, which is what a grouped pull request with no versions, a
        # retitled one, or a missing body all come to.
        #
        # The title and body are ATTACKER-CONTROLLED, so they reach the script
        # only through env and are never interpolated into this script. A ${{ }}
        # in a `run:` block is substituted before bash reads the line, so a
        # crafted title would become shell source; an env value is data to bash
        # and never source.
        run: |
          set -eu
          node .github/scripts/bump-type.mjs | tee -a "$GITHUB_OUTPUT"

      - name: Merge any bump whose gate went green
        if: steps.bump.outputs.bump == 'non-major'
        run: |
          set -eu
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::error::gate passed but the merge did not land after 3 attempts; the bump is unmerged and no deploy was dispatched"
            exit 1
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          #
          # Dispatch the file THIS lab has: most are deploy.yml, some deploy-pages.yml
          # or pages.yml. A copied name 404s only on the auto-merge path, after the
          # merge has landed. See §6.2.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
